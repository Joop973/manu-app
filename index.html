<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0B0F0E" media="(prefers-color-scheme: dark)" />
<meta name="description" content="Manu — lokaler Vermieter- und Finanz-Tresor. Daten bleiben im Browser." />
<title>Manu — Vermieter- und Finanz-Tresor</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'self' data: blob:; base-uri 'none'; form-action 'none';" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<!-- Lucide-Icon-Sprite (lokal, ohne Netzwerk) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs id="icon-sprite"></defs>
</svg>

<div id="app" class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="leaf">M</div>
      <div class="brand-name">Manu</div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="right">
      <label class="advisor-pill" title="Berater-Modus aktivieren (steuer-druckfertige Ansicht)">
        <input type="checkbox" id="advisorToggle" />
        <span>★ Berater-Modus</span>
      </label>
    </div>
  </header>
  <main class="content" id="view"></main>
</div>

<!-- Modal-Container -->
<div id="modal-host"></div>

<script src="app.js"></script>
</body>
</html>
